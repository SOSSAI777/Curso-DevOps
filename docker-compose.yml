services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devops
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10

  app:
    image: tarefas:2.0
    ports:
      - "8001:8000"
    environment:
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      DATABASE_ADDRESS: mysql
      DATABASE: devops
    depends_on:
      mysql:
        condition: service_healthy